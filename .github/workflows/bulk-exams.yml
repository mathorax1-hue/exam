name: Bulk exam run

# Owner-triggered bulk technical runs. Minutes bill to this public repository.
# Inbox ingest and results stay in private raw-exam. Logs are counts only.
# There is no pull_request or pull_request_target trigger.

on:
  workflow_dispatch:
    inputs:
      selection:
        description: "new (inbox or changed sources only), all, or a comma-separated exam list"
        required: false
        type: string
        default: new
      skill_ref:
        description: "certpassly-exam-skill ref (commit SHA preferred)"
        required: false
        type: string
        default: d2f382c32283e0648d6bda0d963dda18dad9674d
      promote:
        description: "Promote only if every gate already passed (default false)"
        required: false
        type: boolean
        default: false
      max_parallel:
        description: "Matrix cap (1-3). Default 2."
        required: false
        type: string
        default: "2"
      ai_vision_provider:
        description: "AI vision provider. Default none."
        required: false
        type: string
        default: none
      use_committed_ai_reads:
        description: "Use committed review/ai-reads.json when present"
        required: false
        type: boolean
        default: true
  repository_dispatch:
    types: [bulk-exams]

permissions:
  contents: read
  actions: read

concurrency:
  group: bulk-exams
  cancel-in-progress: false

jobs:
  refuse:
    if: ${{ github.repository != 'mathorax1-hue/exam' || github.event.repository.fork == true || (github.event_name != 'workflow_dispatch' && github.event_name != 'repository_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse a non-owner or forked run
        run: |
          echo "This workflow only runs on owner-triggered workflow_dispatch or repository_dispatch in mathorax1-hue/exam."
          exit 1

  discover:
    if: ${{ github.repository == 'mathorax1-hue/exam' && github.event.repository.fork == false && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      exam_codes: ${{ steps.list.outputs.exam_codes }}
      count: ${{ steps.list.outputs.count }}
      skill_ref: ${{ steps.params.outputs.skill_ref }}
      promote: ${{ steps.params.outputs.promote }}
      max_parallel: ${{ steps.params.outputs.max_parallel }}
      ai_vision_provider: ${{ steps.params.outputs.ai_vision_provider }}
      use_committed_ai_reads: ${{ steps.params.outputs.use_committed_ai_reads }}
    steps:
      - name: Check owner trigger
        id: params
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_SELECTION: ${{ inputs.selection }}
          INPUT_SKILL: ${{ inputs.skill_ref }}
          INPUT_PROMOTE: ${{ inputs.promote }}
          INPUT_PARALLEL: ${{ inputs.max_parallel }}
          INPUT_PROVIDER: ${{ inputs.ai_vision_provider }}
          INPUT_READS: ${{ inputs.use_committed_ai_reads }}
          PAYLOAD_SELECTION: ${{ github.event.client_payload.selection }}
          PAYLOAD_SKILL: ${{ github.event.client_payload.skill_ref }}
          PAYLOAD_PROMOTE: ${{ github.event.client_payload.promote }}
          PAYLOAD_PARALLEL: ${{ github.event.client_payload.max_parallel }}
          PAYLOAD_PROVIDER: ${{ github.event.client_payload.ai_vision_provider }}
          PAYLOAD_READS: ${{ github.event.client_payload.use_committed_ai_reads }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          if os.environ.get("ACTOR") != os.environ.get("OWNER"):
              sys.exit("only the repository owner may start this run")
          if os.environ.get("EVENT_NAME") == "repository_dispatch":
              selection = (os.environ.get("PAYLOAD_SELECTION") or "new").strip() or "new"
              skill = (os.environ.get("PAYLOAD_SKILL") or "d2f382c32283e0648d6bda0d963dda18dad9674d").strip() or "d2f382c32283e0648d6bda0d963dda18dad9674d"
              promote = str(os.environ.get("PAYLOAD_PROMOTE") or "false").strip().lower()
              parallel = str(os.environ.get("PAYLOAD_PARALLEL") or "2").strip() or "2"
              provider = (os.environ.get("PAYLOAD_PROVIDER") or "none").strip().lower() or "none"
              reads = str(os.environ.get("PAYLOAD_READS") or "true").strip().lower()
          else:
              selection = (os.environ.get("INPUT_SELECTION") or "new").strip() or "new"
              skill = (os.environ.get("INPUT_SKILL") or "d2f382c32283e0648d6bda0d963dda18dad9674d").strip() or "d2f382c32283e0648d6bda0d963dda18dad9674d"
              promote = str(os.environ.get("INPUT_PROMOTE") or "false").strip().lower()
              parallel = str(os.environ.get("INPUT_PARALLEL") or "2").strip() or "2"
              provider = (os.environ.get("INPUT_PROVIDER") or "none").strip().lower() or "none"
              reads = str(os.environ.get("INPUT_READS") or "true").strip().lower()
          if len(selection) > 2000 or any(ch in selection for ch in "\n\r\x00"):
              sys.exit("Invalid selection")
          if not re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", skill):
              sys.exit("Invalid skill ref")
          if promote not in ("true", "false"):
              sys.exit("Invalid promote flag")
          if parallel not in ("1", "2", "3"):
              sys.exit("Invalid max_parallel")
          if provider not in ("none", "groq", "off", "disabled"):
              sys.exit("Invalid ai_vision_provider")
          if provider in ("off", "disabled"):
              provider = "none"
          if reads not in ("true", "false"):
              sys.exit("Invalid use_committed_ai_reads flag")
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write("selection=%s\n" % selection)
              fh.write("skill_ref=%s\n" % skill)
              fh.write("promote=%s\n" % promote)
              fh.write("max_parallel=%s\n" % parallel)
              fh.write("ai_vision_provider=%s\n" % provider)
              fh.write("use_committed_ai_reads=%s\n" % reads)
          print("bulk_params_ok billed_repository=mathorax1-hue/exam max_parallel=%s" % parallel)
          PY

      - name: Check out private raw-exam
        uses: actions/checkout@v4
        with:
          repository: mathorax1-hue/raw-exam
          token: ${{ secrets.CERTPASSLY_REPOS_PAT }}
          path: raw
          lfs: false
          persist-credentials: true

      - name: Fetch inbox PDFs from Git LFS
        working-directory: raw
        run: |
          set -euo pipefail
          git lfs install --local >/dev/null
          if [ -d inbox ]; then
            git lfs pull --include="inbox/**" --exclude="" >/dev/null
          fi

      - name: Check out shared skill
        uses: actions/checkout@v4
        with:
          repository: mathorax1-hue/certpassly-exam-skill
          ref: ${{ steps.params.outputs.skill_ref }}
          path: skill
          persist-credentials: false

      - name: Ingest inbox and list exams
        id: list
        env:
          SELECTION: ${{ steps.params.outputs.selection }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bulk"
          python3 skill/scripts/inbox_ingest.py \
            --raw-root "$GITHUB_WORKSPACE/raw" \
            --output "$RUNNER_TEMP/bulk/ingest.json"
          python3 skill/scripts/list_bulk_exams.py \
            --raw-root "$GITHUB_WORKSPACE/raw" \
            --selection "$SELECTION" \
            --ingest-report "$RUNNER_TEMP/bulk/ingest.json" \
            --output "$RUNNER_TEMP/bulk/planned.json" \
            > "$RUNNER_TEMP/bulk/codes.json"
          python3 - <<'PY'
          import json, os
          planned = json.load(open(os.path.join(os.environ["RUNNER_TEMP"], "bulk", "planned.json"), encoding="utf-8"))
          codes = planned.get("exam_codes") or []
          if not isinstance(codes, list) or any(not isinstance(c, str) for c in codes):
              raise SystemExit("invalid_exam_list")
          out = os.environ["GITHUB_OUTPUT"]
          encoded = json.dumps(codes, separators=(",", ":"))
          with open(out, "a", encoding="utf-8") as fh:
              fh.write("exam_codes=%s\n" % encoded)
              fh.write("count=%s\n" % len(codes))
          print("exam_count=%s" % len(codes))
          PY
          mkdir -p "raw/reports/bulk/${GITHUB_RUN_ID}"
          cp "$RUNNER_TEMP/bulk/planned.json" "raw/reports/bulk/${GITHUB_RUN_ID}/planned.json"
          python3 - <<'PY'
          import json, os
          src = os.path.join(os.environ["RUNNER_TEMP"], "bulk", "ingest.json")
          data = json.load(open(src, encoding="utf-8"))
          # Counts only in the committed discover report.
          inbox = data.get("inbox") or {}
          slim = {
              "generated_at": data.get("generated_at"),
              "inbox": {
                  "pdfs_seen": inbox.get("pdfs_seen", 0),
                  "new_exams": inbox.get("new_exams", 0),
                  "updates": inbox.get("updates", 0),
                  "skipped_duplicate": inbox.get("skipped_duplicate", 0),
                  "skipped_invalid": inbox.get("skipped_invalid", 0),
              },
          }
          dest = os.path.join(os.environ["GITHUB_WORKSPACE"], "raw", "reports", "bulk", os.environ["GITHUB_RUN_ID"], "ingest.json")
          open(dest, "w", encoding="utf-8").write(json.dumps(slim, indent=2) + "\n")
          PY

      - name: Save ingest and plan into private raw-exam
        env:
          EXAM_COUNT: ${{ steps.list.outputs.count }}
        run: |
          set -euo pipefail
          git -C raw config core.safecrlf false
          git -C raw sparse-checkout disable > /dev/null 2>&1 || true
          git -C raw lfs install --local > /dev/null 2>&1 || true
          export GIT_SAVE_ERR="$RUNNER_TEMP/git-discover.err"
          # Stage inbox, sources, versioned PDFs, and the bulk plan. Never print names.
          if ! git -C raw add -- inbox exams reports/bulk/${GITHUB_RUN_ID} > /dev/null 2> "$GIT_SAVE_ERR"; then
            echo "git_add_failed"
            exit 1
          fi
          if git -C raw diff --cached --quiet; then
            echo "ingest_pushed=false"
          else
            git -C raw config user.name "CertPassly Team"
            git -C raw config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git -C raw commit -q -m "inbox: bulk ${GITHUB_RUN_ID} plan (${EXAM_COUNT} exams)" > /dev/null 2> "$GIT_SAVE_ERR"; then
              echo "git_commit_failed"
              exit 1
            fi
            if ! git -C raw pull -q --rebase origin main > /dev/null 2> "$GIT_SAVE_ERR"; then
              echo "git_pull_rebase_failed"
              exit 1
            fi
            if ! git -C raw push -q origin HEAD:main > /dev/null 2> "$GIT_SAVE_ERR"; then
              echo "git_push_failed"
              exit 1
            fi
            echo "ingest_pushed=true"
          fi
          rm -f "$GIT_SAVE_ERR"

  build:
    needs: discover
    if: ${{ needs.discover.outputs.count != '0' && needs.discover.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.discover.outputs.max_parallel) }}
      matrix:
        exam_code: ${{ fromJSON(needs.discover.outputs.exam_codes) }}
    uses: ./.github/workflows/three-phase-exam.yml
    with:
      exam_code: ${{ matrix.exam_code }}
      promote: ${{ needs.discover.outputs.promote == 'true' }}
      skill_ref: ${{ needs.discover.outputs.skill_ref }}
      use_committed_ai_reads: ${{ needs.discover.outputs.use_committed_ai_reads == 'true' }}
      ai_vision_provider: ${{ needs.discover.outputs.ai_vision_provider }}
    secrets: inherit

  summarize:
    needs: [discover, build]
    if: ${{ always() && needs.discover.result == 'success' && github.repository == 'mathorax1-hue/exam' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out private raw-exam
        uses: actions/checkout@v4
        with:
          repository: mathorax1-hue/raw-exam
          token: ${{ secrets.CERTPASSLY_REPOS_PAT }}
          path: raw
          lfs: false
          persist-credentials: true

      - name: Check out shared skill
        uses: actions/checkout@v4
        with:
          repository: mathorax1-hue/certpassly-exam-skill
          ref: ${{ needs.discover.outputs.skill_ref }}
          path: skill
          persist-credentials: false

      - name: Write the bulk summary table
        env:
          EXAM_CODES: ${{ needs.discover.outputs.exam_codes }}
        run: |
          set -euo pipefail
          OUT="raw/reports/bulk/${GITHUB_RUN_ID}"
          mkdir -p "$OUT"
          python3 skill/scripts/write_bulk_summary.py \
            --raw-root "$GITHUB_WORKSPACE/raw" \
            --run-id "$GITHUB_RUN_ID" \
            --exam-codes "$EXAM_CODES" \
            --output-dir "$OUT"
          git -C raw config core.safecrlf false
          git -C raw sparse-checkout disable > /dev/null 2>&1 || true
          export GIT_SAVE_ERR="$RUNNER_TEMP/git-summary.err"
          if ! git -C raw add -- "reports/bulk/${GITHUB_RUN_ID}" > /dev/null 2> "$GIT_SAVE_ERR"; then
            echo "git_add_failed"
            exit 1
          fi
          if git -C raw diff --cached --quiet; then
            echo "summary_pushed=false"
          else
            git -C raw config user.name "CertPassly Team"
            git -C raw config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git -C raw commit -q -m "reports: bulk ${GITHUB_RUN_ID} summary" > /dev/null 2> "$GIT_SAVE_ERR"; then
              echo "git_commit_failed"
              exit 1
            fi
            if ! git -C raw pull -q --rebase origin main > /dev/null 2> "$GIT_SAVE_ERR"; then
              echo "git_pull_rebase_failed"
              exit 1
            fi
            if ! git -C raw push -q origin HEAD:main > /dev/null 2> "$GIT_SAVE_ERR"; then
              echo "git_push_failed"
              exit 1
            fi
            echo "summary_pushed=true"
          fi
          rm -f "$GIT_SAVE_ERR"
