name: Public CertPassly synthetic QA (no private exam data)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/certpassly.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

concurrency:
  group: public-certpassly-synthetic-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certpassly:
    name: Install and run CertPassly
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exam workspace
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Check out pinned CertPassly skill
        uses: actions/checkout@v4
        with:
          repository: msaqlainhaneef1/certpassly-exam-pipeline
          ref: c8d4400598c225c6a32f029f28ca24429649edd6
          path: certpassly-exam-pipeline
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: certpassly-exam-pipeline/requirements.txt

      - name: Check PDF tooling; install only missing utilities
        shell: bash
        run: |
          set -euo pipefail
          if command -v pdftohtml >/dev/null && command -v pdftoppm >/dev/null && command -v tesseract >/dev/null; then
            echo "Required Poppler/Tesseract tools are preinstalled; skipping apt."
          else
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 poppler-utils tesseract-ocr
          fi
          command -v pdftohtml
          command -v pdftoppm
          command -v tesseract

      - name: Install CertPassly skill into runner
        run: |
          python -m pip install -e ./certpassly-exam-pipeline

      - name: Verify command is available
        run: certpassly-pipeline --help

      - name: Run skill regression tests
        working-directory: certpassly-exam-pipeline
        run: python -m unittest discover -s tests -v

      - name: Run full synthetic demo pipelines (no owner data)
        working-directory: certpassly-exam-pipeline
        shell: bash
        run: |
          set -euo pipefail
          python tests/demo_kit.py microsoft "$RUNNER_TEMP/certpassly-demo-ms"
          certpassly-pipeline --exam DM-101 --root "$RUNNER_TEMP/certpassly-demo-ms" --offline --date 2026-11-11
          python scripts/validate_question_v2.py "$RUNNER_TEMP/certpassly-demo-ms/out/DM-101/DM-101.site-format.v2.json"
          python tests/demo_kit.py salesforce "$RUNNER_TEMP/certpassly-demo-generic"
          certpassly-pipeline --exam Demo-Admn-101 --root "$RUNNER_TEMP/certpassly-demo-generic" --offline --date 2026-11-11
          python scripts/validate_question_v2.py "$RUNNER_TEMP/certpassly-demo-generic/out/Demo-Admn-101/Demo-Admn-101.site-format.v2.json"

