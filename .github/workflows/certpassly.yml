name: Public CertPassly synthetic QA (no private exam data)

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/certpassly.yml"
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * 1"

concurrency:
  group: public-certpassly-synthetic-qa
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certpassly:
    name: Install and run CertPassly
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exam workspace
        uses: actions/checkout@v4
        with:
          path: repo

      - name: Check out pinned CertPassly skill
        uses: actions/checkout@v4
        with:
          repository: msaqlainhaneef1/certpassly-exam-pipeline
          ref: 13dea6bab662ab1c4bbf87017e912e519907c8bc
          path: certpassly-exam-pipeline
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: certpassly-exam-pipeline/requirements.txt

      - name: Install PDF tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Install CertPassly skill into runner
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./certpassly-exam-pipeline

      - name: Verify command is available
        run: certpassly-pipeline --help

      - name: Run skill regression tests
        working-directory: certpassly-exam-pipeline
        run: python -m unittest discover -s tests -v

      - name: Run full synthetic demo pipelines (no owner data)
        working-directory: certpassly-exam-pipeline
        shell: bash
        run: |
          set -euo pipefail
          python tests/demo_kit.py microsoft "$RUNNER_TEMP/certpassly-demo-ms"
          certpassly-pipeline --exam DM-101 --root "$RUNNER_TEMP/certpassly-demo-ms" --offline --date 2026-11-11
          python scripts/check_import_conformance.py --root "$RUNNER_TEMP/certpassly-demo-ms" --exam DM-101
          python tests/demo_kit.py salesforce "$RUNNER_TEMP/certpassly-demo-generic"
          certpassly-pipeline --exam Demo-Admn-101 --root "$RUNNER_TEMP/certpassly-demo-generic" --offline --date 2026-11-11
          python scripts/check_import_conformance.py --root "$RUNNER_TEMP/certpassly-demo-generic" --exam Demo-Admn-101

