name: Monitor CertPassly upstream

on:
  schedule:
    - cron: "0 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: certpassly-upstream-watch
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out private workspace repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Compare the reviewed pin with upstream main
        shell: bash
        run: |
          set -euo pipefail
          upstream_sha="$(git ls-remote https://github.com/msaqlainhaneef1/certpassly-exam-pipeline.git refs/heads/main | awk '{print $1}')"
          if [[ ! "$upstream_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Could not obtain upstream Git commit SHA"
            exit 1
          fi
          UPSTREAM_SHA="$upstream_sha" python - <<'PY'
          from datetime import datetime, timezone
          import os
          from pathlib import Path
          import re

          workflow = Path(".github/workflows/certpassly.yml").read_text(encoding="utf-8")
          match = re.search(r"(?m)^\s+ref:\s+([0-9a-f]{40})\s*$", workflow)
          if match is None:
              raise SystemExit("Cannot locate pinned upstream commit in CertPassly workflow")
          pinned = match.group(1)
          upstream = os.environ["UPSTREAM_SHA"]
          status_path = Path("docs/UPSTREAM_STATUS.md")
          prior = status_path.read_text(encoding="utf-8") if status_path.exists() else ""
          old_pinned = re.search(r"Workflow's reviewed source pin: `([0-9a-f]{40})`", prior)
          old_latest = re.search(r"Latest observed upstream main: `([0-9a-f]{40})`", prior)
          if old_pinned and old_latest and old_pinned.group(1) == pinned and old_latest.group(1) == upstream:
              print("No upstream revision or pin change; nothing to commit.")
          else:
              status_path.parent.mkdir(parents=True, exist_ok=True)
              now = datetime.now(timezone.utc).date().isoformat()
              status_path.write_text(
                  "# CertPassly upstream revision watch\n\n"
                  "- Source repository: https://github.com/msaqlainhaneef1/certpassly-exam-pipeline\n"
                  f"- Workflow's reviewed source pin: `{pinned}`\n"
                  f"- Latest observed upstream main: `{upstream}`\n"
                  f"- Revision observation date (UTC): `{now}`\n"
                  "- Schedule: Mondays at 08:00 UTC (13:00 Pakistan Standard Time)\n"
                  "- Policy: Record upstream changes with a Git commit when the observed revision changes. "
                  "Never auto-upgrade the running pipeline or execute unreviewed upstream revisions.\n"
                  "- Upgrade procedure: Read `docs/CERTPASSLY-OPERATIONS.md`, compare upstream changes, "
                  "review instructions and tests, and then update the pinned revision by a separate reviewed change.\n",
                  encoding="utf-8",
              )
              print(f"Recorded upstream {upstream}, reviewed pin {pinned}.")
          PY

      - name: Commit updated upstream status (metadata only)
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/UPSTREAM_STATUS.md; then
            echo "No changed upstream metadata to push."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/UPSTREAM_STATUS.md
          git commit -m "Record newly observed CertPassly upstream revision"
          git push origin HEAD:main
