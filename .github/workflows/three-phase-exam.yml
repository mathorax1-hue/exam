name: Three-phase exam run

# Runs in this public repository so GitHub bills the free public minutes.
# Owner PDFs stay in private raw-exam. Results are pushed back to raw-exam.
# Logs print only counts and pass/fail. No pull_request or pull_request_target
# triggers. Forks do not receive this repository's secrets.

on:
  workflow_dispatch:
    inputs:
      exam_code:
        description: "Exact exams/ folder name in private raw-exam"
        required: true
        type: string
      promote:
        description: "Promote to ready-exams only if every gate already passed (default false)"
        required: false
        type: boolean
        default: false
      skill_ref:
        description: "certpassly-exam-skill ref (commit SHA preferred)"
        required: false
        type: string
        default: main
      use_committed_ai_reads:
        description: "Use committed review/ai-reads.json when present"
        required: false
        type: boolean
        default: true
      ai_vision_provider:
        description: "AI vision provider. Default none on the public runner."
        required: false
        type: string
        default: none
  repository_dispatch:
    types: [three-phase-exam]
  workflow_call:
    inputs:
      exam_code:
        description: "Exact exams/ folder name in private raw-exam"
        required: true
        type: string
      promote:
        required: false
        type: boolean
        default: false
      skill_ref:
        required: false
        type: string
        default: main
      use_committed_ai_reads:
        required: false
        type: boolean
        default: true
      ai_vision_provider:
        required: false
        type: string
        default: none

permissions:
  contents: read
  actions: read

concurrency:
  group: three-phase-exam-${{ inputs.exam_code || github.event.client_payload.exam_code || github.run_id }}
  cancel-in-progress: false

jobs:
  refuse:
    if: ${{ github.repository != 'mathorax1-hue/exam' || github.event.repository.fork == true || (github.event_name != 'workflow_dispatch' && github.event_name != 'repository_dispatch' && github.event_name != 'workflow_call') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Refuse a non-owner or forked run
        run: |
          echo "This workflow only runs on owner-triggered workflow_dispatch or repository_dispatch in mathorax1-hue/exam."
          exit 1

  run:
    if: ${{ github.repository == 'mathorax1-hue/exam' && github.event.repository.fork == false && (github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'workflow_call') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      actions: read
    outputs:
      exam_code: ${{ steps.params.outputs.exam_code }}
      results_pushed: ${{ steps.save.outputs.results_pushed }}
      skill_ref: ${{ steps.params.outputs.skill_ref }}
    env:
      UPSTREAM_PIN: d9b6bf67efb870019dd88caeffa90952b7e000d3
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Check owner trigger and exam code
        id: params
        env:
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CODE: ${{ inputs.exam_code }}
          INPUT_PROMOTE: ${{ inputs.promote }}
          INPUT_SKILL: ${{ inputs.skill_ref }}
          INPUT_READS: ${{ inputs.use_committed_ai_reads }}
          INPUT_PROVIDER: ${{ inputs.ai_vision_provider }}
          PAYLOAD_CODE: ${{ github.event.client_payload.exam_code }}
          PAYLOAD_PROMOTE: ${{ github.event.client_payload.promote }}
          PAYLOAD_SKILL: ${{ github.event.client_payload.skill_ref }}
          PAYLOAD_READS: ${{ github.event.client_payload.use_committed_ai_reads }}
          PAYLOAD_PROVIDER: ${{ github.event.client_payload.ai_vision_provider }}
        run: |
          python3 - <<'PY'
          import os, re, sys
          if os.environ.get("ACTOR") != os.environ.get("OWNER"):
              sys.exit("only the repository owner may start this run")
          code = (os.environ.get("INPUT_CODE") or "").strip()
          if code:
              promote = str(os.environ.get("INPUT_PROMOTE") or "false").strip().lower()
              skill = (os.environ.get("INPUT_SKILL") or "main").strip() or "main"
              reads = str(os.environ.get("INPUT_READS") or "true").strip().lower()
              provider = (os.environ.get("INPUT_PROVIDER") or "none").strip().lower() or "none"
          elif os.environ.get("EVENT_NAME") == "repository_dispatch":
              code = (os.environ.get("PAYLOAD_CODE") or "").strip()
              promote = str(os.environ.get("PAYLOAD_PROMOTE") or "false").strip().lower()
              skill = (os.environ.get("PAYLOAD_SKILL") or "main").strip() or "main"
              reads = str(os.environ.get("PAYLOAD_READS") or "true").strip().lower()
              provider = (os.environ.get("PAYLOAD_PROVIDER") or "none").strip().lower() or "none"
          else:
              sys.exit("Invalid exam code")
          if not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._-]{1,39}", code):
              sys.exit("Invalid exam code")
          if code.startswith("TEST-"):
              promote = "false"
          if not re.fullmatch(r"[A-Za-z0-9._/-]{1,200}", skill):
              sys.exit("Invalid skill ref")
          if promote not in ("true", "false"):
              sys.exit("Invalid promote flag")
          if reads not in ("true", "false"):
              sys.exit("Invalid use_committed_ai_reads flag")
          if provider not in ("none", "groq", "off", "disabled"):
              sys.exit("Invalid ai_vision_provider")
          if provider in ("off", "disabled"):
              provider = "none"
          out = os.environ["GITHUB_OUTPUT"]
          with open(out, "a", encoding="utf-8") as fh:
              fh.write("exam_code=%s\n" % code)
              fh.write("promote=%s\n" % promote)
              fh.write("skill_ref=%s\n" % skill)
              fh.write("use_committed_ai_reads=%s\n" % reads)
              fh.write("ai_vision_provider=%s\n" % provider)
          print("exam_code_ok billed_repository=mathorax1-hue/exam")
          PY

      - name: Check out private raw-exam
        uses: actions/checkout@v4
        with:
          repository: mathorax1-hue/raw-exam
          token: ${{ secrets.CERTPASSLY_REPOS_PAT }}
          path: raw
          lfs: false
          persist-credentials: true

      - name: Fetch only this exam PDF from Git LFS
        working-directory: raw
        env:
          EXAM_CODE: ${{ steps.params.outputs.exam_code }}
        run: |
          set -euo pipefail
          git lfs install --local >/dev/null
          git lfs pull --include="exams/${EXAM_CODE}/source/*" --exclude="" >/dev/null

      - name: Check out shared skill
        uses: actions/checkout@v4
        with:
          repository: mathorax1-hue/certpassly-exam-skill
          ref: ${{ steps.params.outputs.skill_ref }}
          path: skill
          persist-credentials: false

      - name: Check out pinned upstream v1.3.0
        uses: actions/checkout@v4
        with:
          repository: msaqlainhaneef1/certpassly-exam-pipeline
          ref: d9b6bf67efb870019dd88caeffa90952b7e000d3
          path: upstream
          persist-credentials: false

      - name: Confirm upstream pin
        run: test "$(git -C upstream rev-parse HEAD)" = "$UPSTREAM_PIN"

      - name: Apply skill patches to pinned upstream
        run: |
          set -euo pipefail
          shopt -s nullglob
          applied=0
          for p in skill/patches/upstream/v1.3.0-*.patch; do
            echo "Applying $p"
            git -C upstream apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
            applied=$((applied+1))
          done
          echo "applied_patch_count=$applied"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: upstream/requirements.txt

      - name: Install PDF tools if missing
        run: |
          set -euo pipefail
          if command -v pdftohtml >/dev/null && command -v pdftoppm >/dev/null && command -v tesseract >/dev/null; then
            echo "poppler and tesseract already present"
          else
            sudo apt-get update -o Acquire::Retries=3
            sudo apt-get install -y -o Acquire::Retries=3 poppler-utils tesseract-ocr
          fi
          echo "pdftotext_ok tesseract_ok"

      - name: Install pinned upstream
        run: python -m pip install -q -e ./upstream

      - name: Check out ready-exams when promoting
        if: ${{ steps.params.outputs.promote == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: mathorax1-hue/ready-exams
          token: ${{ secrets.CERTPASSLY_REPOS_PAT }}
          path: ready
          persist-credentials: true

      - name: Run three phases (quiet public log)
        id: phase
        env:
          PYTHONUNBUFFERED: "1"
          EXAM_CODE: ${{ steps.params.outputs.exam_code }}
          PROMOTE: ${{ steps.params.outputs.promote }}
          CERTPASSLY_AI_VISION_PROVIDER: ${{ steps.params.outputs.ai_vision_provider }}
          CERTPASSLY_AI_VISION_ENABLED: ${{ steps.params.outputs.ai_vision_provider == 'groq' }}
          CERTPASSLY_USE_COMMITTED_AI_READS: ${{ steps.params.outputs.use_committed_ai_reads }}
          CERTPASSLY_PRIVATE_LOG: ${{ runner.temp }}/private-run.log
        run: |
          set -euo pipefail
          echo "billed_repository=${GITHUB_REPOSITORY}"
          RAW_SHA="$(git -C raw rev-parse HEAD)"
          PROMOTE_FLAG=()
          if [ "$PROMOTE" = "true" ]; then
            PROMOTE_FLAG=(--promote)
          fi
          READY_ROOT="$RUNNER_TEMP/ready-dry"
          if [ -d "$GITHUB_WORKSPACE/ready" ]; then
            READY_ROOT="$GITHUB_WORKSPACE/ready"
          fi
          set +e
          python skill/scripts/run_three_phase.py \
            --exam "$EXAM_CODE" \
            --workspace "$RUNNER_TEMP/work" \
            --upstream "$GITHUB_WORKSPACE/upstream" \
            --raw-dir "$GITHUB_WORKSPACE/raw/exams/$EXAM_CODE" \
            --exam-links "$GITHUB_WORKSPACE/raw/catalog/exam-links.csv" \
            --ready-root "$READY_ROOT" \
            --raw-commit "$RAW_SHA" \
            --private-log "$CERTPASSLY_PRIVATE_LOG" \
            "${PROMOTE_FLAG[@]}"
          PHASE_RC=$?
          set -e
          # The private log is expected to contain question text. Do not fail on it
          # and never print it. Scan only the public step summary here.
          if [ -n "${GITHUB_STEP_SUMMARY:-}" ] && [ -f "$GITHUB_STEP_SUMMARY" ]; then
            python skill/scripts/check_log_leak.py \
              --log "$GITHUB_STEP_SUMMARY" \
              --site-file "$RUNNER_TEMP/work/out/$EXAM_CODE/$EXAM_CODE.site-format.v2.json" \
              --export-dir "$RUNNER_TEMP/work/out/$EXAM_CODE/export" \
              --raw-dir "$GITHUB_WORKSPACE/raw/exams/$EXAM_CODE"
          fi
          echo "phase_rc=$PHASE_RC" >> "$GITHUB_OUTPUT"
          exit "$PHASE_RC"

      - name: Save reports into private raw-exam
        id: save
        if: ${{ !cancelled() }}
        env:
          EXAM_CODE: ${{ steps.params.outputs.exam_code }}
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/work/out/$EXAM_CODE"
          if [ ! -d "$SRC" ]; then
            echo "results_pushed=false" >> "$GITHUB_OUTPUT"
            echo "No output directory."
            exit 0
          fi
          DEST="raw/exams/${EXAM_CODE}/runs/${GITHUB_RUN_ID}"
          mkdir -p "$DEST"
          cp -a "$SRC/." "$DEST/"
          # Never copy the captured private log or the owner PDF into git.
          rm -f "$DEST/private-run.log"
          find "$DEST" -type f -name '*.pdf' -delete
          # Keep git quiet so file names never reach the public log.
          echo "dest_file_count=$(find "$DEST" -type f | wc -l)"
          git -C raw config core.safecrlf false
          git -C raw sparse-checkout disable > /dev/null 2>&1 || true
          git -C raw lfs install --local > /dev/null 2>&1 || true
          export GIT_SAVE_ERR="$RUNNER_TEMP/git-save.err"
          if ! git -C raw add -- \
            "exams/${EXAM_CODE}/runs/${GITHUB_RUN_ID}" \
            "exams/${EXAM_CODE}/questions-index.json" \
            "exams/${EXAM_CODE}/changes" \
            > /dev/null 2> "$GIT_SAVE_ERR"; then
            python3 - <<'PY'
          import os
          path = os.environ["GIT_SAVE_ERR"]
          text = open(path, errors="replace").read().lower()
          reason = "other"
          for key, label in (
              ("sparse-checkout", "sparse"),
              ("pathspec", "pathspec"),
              ("did not match", "pathspec"),
              ("git-lfs", "lfs"),
              ("safecrlf", "crlf"),
              ("permission", "permission"),
              ("index.lock", "index_lock"),
              ("not a git repository", "not_repo"),
              ("disk", "disk"),
          ):
              if key in text:
                  reason = label
                  break
          print("git_add_failed reason=%s err_bytes=%s" % (reason, os.path.getsize(path)))
          PY
            exit 1
          fi
          if git -C raw diff --cached --quiet; then
            echo "results_pushed=false" >> "$GITHUB_OUTPUT"
            echo "No new raw-exam files."
          else
            git -C raw config user.name "CertPassly Team"
            git -C raw config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git -C raw commit -q -m "results(${EXAM_CODE}): three-phase run ${GITHUB_RUN_ID}" > /dev/null 2> "$RUNNER_TEMP/git-save.err"; then
              echo "git_commit_failed"
              exit 1
            fi
            if ! git -C raw pull -q --rebase origin main > /dev/null 2> "$RUNNER_TEMP/git-save.err"; then
              echo "git_pull_rebase_failed"
              exit 1
            fi
            if ! git -C raw push -q origin HEAD:main > /dev/null 2> "$RUNNER_TEMP/git-save.err"; then
              echo "git_push_failed"
              exit 1
            fi
            echo "results_pushed=true" >> "$GITHUB_OUTPUT"
            echo "results_pushed=true"
          fi
          rm -f "$RUNNER_TEMP/git-save.err"

      - name: Push ready-exams only when promoted
        if: ${{ steps.params.outputs.promote == 'true' }}
        env:
          EXAM_CODE: ${{ steps.params.outputs.exam_code }}
        run: |
          set -euo pipefail
          REPORT="$RUNNER_TEMP/work/out/$EXAM_CODE/phase-reports/promotion.json"
          STATUS="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1])).get("status") or "")' "$REPORT")"
          echo "promotion_status=$STATUS"
          if [ "$STATUS" != "promoted" ]; then
            echo "ready-exams not updated"
            exit 0
          fi
          git -C ready add "exams/${EXAM_CODE}"
          if git -C ready diff --cached --quiet; then
            echo "No new ready-exams files."
            exit 0
          fi
          git -C ready config user.name "CertPassly Team"
          git -C ready config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C ready commit -m "promote(${EXAM_CODE}): run ${GITHUB_RUN_ID}"
          git -C ready pull --rebase origin main
          git -C ready push origin HEAD:main
          echo "ready_exams_pushed=true"

      - name: Public-safe summary
        if: ${{ !cancelled() }}
        env:
          EXAM_CODE: ${{ steps.params.outputs.exam_code }}
        run: |
          python3 - <<'PY'
          import json, os
          path = os.path.join(os.environ["RUNNER_TEMP"], "work", "out", os.environ["EXAM_CODE"], "phase-reports", "public-summary.json")
          data = json.load(open(path, encoding="utf-8"))
          printed = {k: v for k, v in data.items() if k != "promotion_blockers"}
          printed["billed_repository"] = os.environ.get("GITHUB_REPOSITORY")
          print(json.dumps(printed, indent=2))
          PY

  leak-check-public-log:
    needs: run
    if: ${{ always() && needs.run.result != 'skipped' && github.repository == 'mathorax1-hue/exam' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: Download the completed run job log
        env:
          GH_TOKEN: ${{ github.token }}
          EXAM_CODE: ${{ needs.run.outputs.exam_code }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publog"
          JOB_ID="$(python3 - <<'PY'
          import json, os, urllib.request
          url = "https://api.github.com/repos/%s/actions/runs/%s/jobs?per_page=20" % (
              os.environ["GITHUB_REPOSITORY"], os.environ["GITHUB_RUN_ID"])
          req = urllib.request.Request(url)
          req.add_header("Accept", "application/vnd.github+json")
          req.add_header("X-GitHub-Api-Version", "2022-11-28")
          req.add_header("User-Agent", "certpassly-exam-pipeline")
          req.add_header("Authorization", "Bearer " + os.environ["GH_TOKEN"])
          with urllib.request.urlopen(req, timeout=30) as resp:
              data = json.loads(resp.read().decode())
          exam = (os.environ.get("EXAM_CODE") or "").strip()
          matches = []
          for job in data.get("jobs") or []:
              name = job.get("name") or ""
              if job.get("id") and (name == "run" or name.endswith(" / run")):
                  matches.append(job)
          chosen = None
          if len(matches) == 1:
              chosen = matches[0]
          elif exam:
              for job in matches:
                  if exam in (job.get("name") or ""):
                      chosen = job
                      break
          if not chosen:
              raise SystemExit("run_job_id_missing")
          print(chosen["id"])
          PY
          )"
          echo "run_job_id=${JOB_ID}"
          export JOB_ID
          export ZIP_PATH="$RUNNER_TEMP/publog.zip"
          attempts=0
          ok=0
          while [ "$attempts" -lt 12 ]; do
            attempts=$((attempts+1))
            rm -f "$ZIP_PATH"
            if gh api --allow-escape-sequences \
              "/repos/${GITHUB_REPOSITORY}/actions/jobs/${JOB_ID}/logs" \
              > "$ZIP_PATH"; then
              if python3 - <<'PY'
          import os, shutil, zipfile
          src = os.environ["ZIP_PATH"]
          dest = os.path.join(os.environ["RUNNER_TEMP"], "publog")
          os.makedirs(dest, exist_ok=True)
          with open(src, "rb") as fh:
              head = fh.read(4)
          if head.startswith(b"PK"):
              zipfile.ZipFile(src).extractall(dest)
          else:
              shutil.copyfile(src, os.path.join(dest, "run-job.log"))
          found = False
          for root, _dirs, files in os.walk(dest):
              if files:
                  found = True
                  break
          raise SystemExit(0 if found else 1)
          PY
              then
                ok=1
                break
              fi
            fi
            sleep 5
          done
          rm -f "$ZIP_PATH"
          if [ "$ok" != "1" ]; then
            echo "leak_check=fail reason=log_download_failed"
            exit 2
          fi
          echo "log_download=ok"

      - name: Check out pushed raw-exam results
        if: ${{ needs.run.outputs.results_pushed == 'true' }}
        uses: actions/checkout@v4
        with:
          repository: mathorax1-hue/raw-exam
          token: ${{ secrets.CERTPASSLY_REPOS_PAT }}
          path: raw-results
          lfs: false
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            exams/${{ needs.run.outputs.exam_code }}/runs/${{ github.run_id }}/**
            exams/${{ needs.run.outputs.exam_code }}/source/**

      - name: Check out the leak scanner
        uses: actions/checkout@v4
        with:
          repository: mathorax1-hue/certpassly-exam-skill
          ref: ${{ needs.run.outputs.skill_ref }}
          path: skill-scan
          persist-credentials: false
          sparse-checkout: |
            scripts

      - name: Scan the public run log
        env:
          EXAM_CODE: ${{ needs.run.outputs.exam_code }}
          RESULTS_PUSHED: ${{ needs.run.outputs.results_pushed }}
        run: |
          set -euo pipefail
          ARGS=(--log "$RUNNER_TEMP/publog" --output "$RUNNER_TEMP/leak-check-public-log.json")
          SITE="raw-results/exams/${EXAM_CODE}/runs/${GITHUB_RUN_ID}/${EXAM_CODE}.site-format.v2.json"
          EXPORT="raw-results/exams/${EXAM_CODE}/runs/${GITHUB_RUN_ID}/export"
          RAW="raw-results/exams/${EXAM_CODE}"
          if [ "${RESULTS_PUSHED}" = "true" ] && [ -f "$SITE" ]; then
            ARGS+=(--site-file "$SITE")
          fi
          if [ "${RESULTS_PUSHED}" = "true" ] && [ -d "$EXPORT" ]; then
            ARGS+=(--export-dir "$EXPORT")
          fi
          if [ "${RESULTS_PUSHED}" = "true" ] && [ -d "$RAW" ]; then
            ARGS+=(--raw-dir "$RAW")
          fi
          python3 skill-scan/scripts/check_log_leak.py "${ARGS[@]}"
          rm -rf "$RUNNER_TEMP/publog"
