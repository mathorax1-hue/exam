name: CertPassly secure exam intake

on:
  workflow_dispatch:
    inputs:
      exam_code:
        description: "Official exam code, e.g. AB-900"
        required: true
        type: string
        default: "AB-900"
      vendor:
        description: "Official vendor name for the catalog sheet"
        required: true
        type: string
        default: "Microsoft"
      folder_url:
        description: "Owner-authorized publicly readable Google Drive folder URL (stored in run inputs, not Git)"
        required: true
        type: string
      rights_confirmed:
        description: "I confirm permission to use these files to prepare exam materials"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: certpassly-intake-${{ inputs.exam_code }}
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      EXAM_CODE: ${{ inputs.exam_code }}
      VENDOR: ${{ inputs.vendor }}
      OWNER_FOLDER_URL: ${{ inputs.folder_url }}
      RIGHTS_CONFIRMED: ${{ inputs.rights_confirmed }}
      WS: ${{ runner.temp }}/certpassly-private-workspace
    steps:
      - name: Validate run inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$RIGHTS_CONFIRMED" != "true" ]]; then
            echo "::error::Confirm owner rights to use the PDF before running."
            exit 1
          fi
          if [[ ! "$EXAM_CODE" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{1,63}$ ]]; then
            echo "::error::Invalid exam code."
            exit 1
          fi
          if [[ ! "$VENDOR" =~ ^[A-Za-z][A-Za-z0-9.\ -]{1,63}$ ]]; then
            echo "::error::Invalid vendor name."
            exit 1
          fi
          if [[ ! "$OWNER_FOLDER_URL" =~ ^https://drive.google.com/drive/folders/[A-Za-z0-9_-]+ ]]; then
            echo "::error::Supply a Drive folder URL (not a local path or a file URL)."
            exit 1
          fi
          echo "::add-mask::$OWNER_FOLDER_URL"

      - name: Check out tested CertPassly revision
        uses: actions/checkout@v4
        with:
          repository: msaqlainhaneef1/certpassly-exam-pipeline
          ref: 13dea6bab662ab1c4bbf87017e912e519907c8bc
          path: skill
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PDF utilities
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr

      - name: Install pinned skill
        run: |
          python -m pip install -e ./skill
          certpassly-pipeline --help >/dev/null

      - name: Create temporary owner-authorized workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$WS/config"
          cp skill/config/pipeline.example.yaml "$WS/config/pipeline.yaml"
          cp skill/config/vendors.example.yaml "$WS/config/vendors.yaml"
          python - <<'PY'
          import csv
          import os
          from datetime import date
          from pathlib import Path
          import yaml

          root = Path(os.environ["WS"])
          p = root / "config" / "pipeline.yaml"
          d = yaml.safe_load(p.read_text(encoding="utf-8"))
          d["owner_rights_statement"] = (
              f"User confirmed permission to use the owner exam PDFs for exam preparation on {date.today().isoformat()}."
          )
          p.write_text(yaml.safe_dump(d, sort_keys=False, allow_unicode=True), encoding="utf-8")
          with (root / "sheet.csv").open("w", newline="", encoding="utf-8") as f:
              w = csv.writer(f)
              w.writerow([os.environ["VENDOR"], "", ""])
              w.writerow([os.environ["EXAM_CODE"], "", os.environ["OWNER_FOLDER_URL"]])
          print("Created a temporary owner-authorized catalog; private folder URL not printed.")
          PY

      - name: Run catalog, intake, source research and extraction
        id: pipeline
        shell: bash
        run: |
          set -euo pipefail
          certpassly-pipeline --root "$WS" --sheet "$WS/sheet.csv" --stage catalog
          certpassly-pipeline --exam "$EXAM_CODE" --root "$WS" --stage intake --stage sources --stage research --stage extract --stage textfix --stage answer_research --stage intent

      - name: Write metadata-only intake report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p safe-report
          python - <<'PY'
          import json
          import os
          import re
          from datetime import datetime, timezone
          from pathlib import Path
          import hashlib

          root = Path(os.environ["WS"])
          code = os.environ["EXAM_CODE"]
          source = root / "owner-files" / code
          pdfs = sorted(source.rglob("*.pdf")) if source.exists() else []
          summary = {
              "date_utc": datetime.now(timezone.utc).isoformat(),
              "exam": code,
              "source_skill_commit": "13dea6bab662ab1c4bbf87017e912e519907c8bc",
              "owner_rights_confirmed": os.environ.get("RIGHTS_CONFIRMED") == "true",
              "pdf_count": len(pdfs),
              "pdfs": [{"sha256": hashlib.sha256(p.read_bytes()).hexdigest(), "size_bytes": p.stat().st_size} for p in pdfs],
              "raw_owner_text_or_links_in_report": False,
          }
          split_path = root / "out" / code / "extracted" / "split.json"
          if split_path.exists():
              try:
                  data = json.loads(split_path.read_text(encoding="utf-8"))
                  summary["extract_present"] = True
                  summary["extracted_record_count"] = len(data)
              except (ValueError, OSError):
                  summary["extract_present"] = True
                  summary["extracted_record_count"] = None
          else:
              summary["extract_present"] = False
          Path("safe-report/intake.json").write_text(json.dumps(summary, indent=2)+"\n", encoding="utf-8")
          PY

      - name: Upload metadata only (no PDFs, keys or raw extracts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: intake-summary-${{ github.run_id }}
          path: safe-report/intake.json
          retention-days: 7
          if-no-files-found: error

      - name: Summarize limitation
        if: always()
        shell: bash
        run: |
          echo "This job runs the pre-author stages only. The AI author stage and real exam package are NOT complete."
          echo "Folder must be publicly readable by GitHub's runner; ChatGPT's Google Drive connection does not transfer to Actions."
          echo "No original owner PDFs, question text or source Drive links are persisted as Git commits or artifacts."
